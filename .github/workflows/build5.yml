name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Build and publish
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc -sdk "$SDK" -target arm64-apple-ios15.0 -O main.swift -o LoopRec -framework UIKit -framework AVFoundation
          mkdir -p Payload/LoopRec.app
          cp LoopRec Info.plist Payload/LoopRec.app/
          ldid -S Payload/LoopRec.app/LoopRec
          zip -qry LoopRec.ipa Payload
          URL=$(curl -sS -F "reqtype=fileupload" -F "time=1h" -F "fileToUpload=@LoopRec.ipa" https://litterbox.catbox.moe/resources/internals/api.php)
          echo "IPA_URL=$URL"
          echo "IPA_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
